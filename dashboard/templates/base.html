<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="30">
<title>{% block title %}PhantomNet Security Console{% endblock %}</title>
<style>
  :root { --bg:#0b0d0c; --fg:#c9d1c9; --dim:#6b756d; --green:#4ade80; --amber:#fbbf24;
          --red:#f87171; --cyan:#67e8f9; --line:#2a312c; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font:14px/1.55 ui-monospace, "Cascadia Mono", Consolas, "Liberation Mono", monospace; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  a { color:var(--cyan); text-decoration:none; } a:hover { text-decoration:underline; }
  .prompt { color:var(--green); }
  .dim { color:var(--dim); }
  .ok { color:var(--green); } .warn { color:var(--amber); } .bad { color:var(--red); }
  .sev-high { color:var(--red); font-weight:bold; }
  .sev-medium { color:var(--amber); }
  .sev-low, .sev-info { color:var(--cyan); }
  h2 { font-size:14px; font-weight:normal; color:var(--green); margin:22px 0 6px; }
  h2::before { content:"== "; } h2::after { content:" =="; }
  pre, .block { margin:0; white-space:pre-wrap; word-break:break-word; }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:1px 14px 1px 0; vertical-align:top; white-space:nowrap; }
  td.wrap { white-space:normal; word-break:break-word; min-width:12ch; }
  th { color:var(--dim); font-weight:normal; border-bottom:1px dashed var(--line); }
  .scroll { overflow-x:auto; }
  ul.plain { list-style:none; margin:0; padding:0; }
  ul.plain li::before { content:"- "; color:var(--dim); }
  .cursor { display:inline-block; width:8px; height:15px; background:var(--green);
            vertical-align:text-bottom; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @media (max-width: 640px) {
    main { padding:12px 16px; }
    th, td { white-space:normal; padding-right:10px; }
    td.wrap { min-width:0; }
    .wide-only { display:none; }
  }
  footer { margin-top:24px; color:var(--dim); border-top:1px dashed var(--line); padding-top:6px; }
</style>
</head>
<body>
<main>
<div><span class="prompt">phantomnet@{% block sensor %}sensor{% endblock %}</span>:<span class="dim">{% block path %}~{% endblock %}</span>$ {% block cmd %}status{% endblock %}</div>
{% block content %}{% endblock %}
<footer>PhantomNet Security Console v0.1 · auto-refresh 30s · <a href="/">home</a> · <a href="/api/summary">api</a> <span class="cursor"></span></footer>
</main>
</body>
</html>
